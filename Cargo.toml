[package]
name = "nu_plugin_jev"
version = "0.1.1"
authors = ["Gleb Chipiga <gleb.chipiga@gmail.com>"]
edition = "2024"
description = "Nushell plugin for TypeSafe Jev structured decisions"
repository = "https://github.com/gleb-chipiga/nu_plugin_jev"
license = "MIT"
readme = "README.md"

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[features]
default = ["mimalloc", "nuon-tracing-format", "http2-prior-knowledge"]
http2-prior-knowledge = []
nuon-tracing-format = ["dep:time"]

[dependencies]
nu-plugin = "=0.116"
nu-protocol = "=0.116"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "system-proxy", "socks"] }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "1.1"
dirs = "7"
thiserror = "2"
futures = "0.3"
lru = "0.18"
httpdate = "1"
tracing = "0.1"
tracing-log = { version = "0.2", default-features = false, features = ["log-tracer", "std"] }
log = "0.4"
time = { version = "0.3", default-features = false, features = ["formatting", "std"], optional = true }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
mimalloc = { version = "0.1", optional = true }

[dev-dependencies]
nu-plugin-test-support = "=0.116"
h2 = "0.4"
http = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
rcgen = "0.14"
tokio-rustls = "0.26"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.dist]
inherits = "release"
