[package]
name = "nu_plugin_jev"
version = "0.1.0"
authors = ["Gleb Chipiga <gleb.chipiga@gmail.com>"]
edition = "2024"
description = "Nushell plugin for TypeSafe Jev structured decisions"
repository = "https://github.com/gleb-chipiga/nu_plugin_jev"
license = "MIT"
readme = "README.md"

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[features]
default = ["mimalloc"]

[dependencies]
nu-plugin = "=0.116"
nu-protocol = "=0.116"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "system-proxy", "socks"] }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
dirs = "7"
thiserror = "2"
futures = "0.3"
lru = "0.18"
httpdate = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
mimalloc = { version = "0.1", features = ["v3"], optional = true }

[dev-dependencies]
nu-plugin-test-support = "=0.116"
h2 = "0.4"
http = "1"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[profile.release]
lto = "fat"
codegen-units = 1

[profile.dist]
inherits = "release"
